services:
  api:
    build: .
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-aradlens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aradlens}
      MYSQL_DB: ${MYSQL_DB:-AradLens}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      SECRET_KEY: ${SECRET_KEY:-schimba-aceasta-cheie-in-productie}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aradlens.ro}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      MEDIA_DIR: ${MEDIA_DIR:-/app/media}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      FRONTEND_URL: ${FRONTEND_URL:-https://admin.aradlens.binarysquad.club}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      RETURN_RESET_LINK: ${RETURN_RESET_LINK:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-60}
    volumes:
      - media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8011:8000"

volumes:
  media_data:
